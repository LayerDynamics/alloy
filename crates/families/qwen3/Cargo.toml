[package]
name = "qwen3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minijinja = { workspace = true }
sha2 = "=0.10.9"
safetensors = "=0.8.0"
half = "=2.4.1"
serde_json = "=1.0.145"
inference-infra = { path = "../../inference-infra" }
mlx-ffi = { path = "../../mlx-ffi" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10.9 gates ARM SHA instructions behind this feature. Enable it where
# model bytes are verified so standalone loader tests and the daemon share the
# same backend; Cargo unifies this dependency with engine/alloyd on this target.
sha2 = { version = "=0.10.9", features = ["asm"] }

[lints]
workspace = true

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: pins and corpus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-jsonschema
          bash scripts/pins_check.sh --test
          bash bench/corpus/validate.sh

      - name: bindgen image and test 10
        run: |
          docker build --platform linux/arm64 \
            -t alloy-builder:phase0 \
            -f scripts/docker/Dockerfile \
            scripts/docker
          bash scripts/bindgen_check.sh --test

      - name: inventory gate
        run: bash scripts/coverage_inventory.sh --test

      - name: native image, FFI tests, test 11, and inference-infra tests
        run: |
          docker build --platform linux/arm64 \
            -t alloy-native-builder:phase0 \
            -f scripts/docker/Dockerfile.repro \
            scripts/docker
          ALLOY_BUILDER_IMAGE=alloy-native-builder:phase0 \
            bash scripts/repro_check.sh --test
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src:ro \
            -e CARGO_TERM_COLOR=never \
            -w /work \
            alloy-native-builder:phase0 \
            bash -c 'tar -C /src --exclude=target --exclude=.git -cf - . | tar -C /work -xf - && cargo test --locked -p mlx-ffi --test raii --test compile --test ops -- --test-threads=1 && cargo test --locked -p inference-infra --test infra_cpu_ops'

  mac:
    name: mac-metal
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Metal and unified tests
        run: cargo test --locked -p mlx-ffi --no-fail-fast -- --test-threads=1
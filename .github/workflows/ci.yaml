name: Diagnose installed Homebrew readiness
on:
  push:
    branches: [ci/homebrew-doctor-diagnostic]
permissions:
  contents: read
concurrency:
  group: homebrew-doctor-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 40
    env:
      ALLOY_QWEN3_ARTIFACT: ${{ vars.ALLOY_QWEN3_ARTIFACT }}
      ALLOY_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/target/phase-1-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Capture the installed formula readiness failure
        run: exec node scripts/homebrew/ci.mjs
      - name: Clean only this diagnostic run's resources
        if: always()
        run: exec node scripts/homebrew/ci.mjs --cleanup-owned
      - name: Retain installed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-doctor-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/phase-1-acceptance/
          if-no-files-found: warn
          retention-days: 7

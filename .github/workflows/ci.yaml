name: Recover owned Homebrew CI installer

on:
  push:
    branches: [ci/recover-homebrew-42313536852]

permissions:
  contents: read

concurrency:
  group: recover-homebrew-42313536852
  cancel-in-progress: false

jobs:
  recover:
    name: Verify and retire abandoned Alloy test installer
    if: github.repository == 'LayerDynamics/alloy'
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 5
    steps:
      - name: Check out recovery evidence and script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Recover only the verified cancelled installer
        run: node scripts/homebrew/recover-42313536852.mjs
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/homebrew-recovery/
          if-no-files-found: warn
          retention-days: 7

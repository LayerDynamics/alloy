name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Plugin collector output lifecycle
        run: python3 -B -m unittest discover -s scripts/tests -p test_plugin_acceptance_output.py
      - name: CI shard and required-check invariants
        run: ruby scripts/tests/ci_partition_test.rb
      - name: Host lock regression
        run: python3 -B -m unittest discover -s scripts/tests -p test_mac_ci_lock.py
      - name: Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ts/cli/package-lock.json
      - name: CLI and monitor tests
        working-directory: ts/cli
        run: npm ci && npm test && node --test scripts/real-model-acceptance.test.mjs && node --test ../../scripts/homebrew/*.test.mjs

  linux_foundation:
    name: linux-foundation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: pins and corpus
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-jsonschema
          bash scripts/pins_check.sh --test
          bash bench/corpus/validate.sh
      - name: bindgen image and test 10
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 -t alloy-builder:phase0 -f scripts/docker/Dockerfile scripts/docker
          bash scripts/bindgen_check.sh --test
      - name: inventory gate
        run: bash scripts/coverage_inventory.sh --test

  linux_repro:
    name: linux-reproducibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: build native test image
        run: docker build --platform linux/arm64 -t alloy-native-builder:phase0 -f scripts/docker/Dockerfile.repro scripts/docker
      - name: native build reproducibility
        run: ALLOY_BUILDER_IMAGE=alloy-native-builder:phase0 bash scripts/repro_check.sh --test

  linux_engine:
    name: linux-engine-and-native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: build native test image
        run: docker build --platform linux/arm64 -t alloy-native-builder:phase0 -f scripts/docker/Dockerfile.repro scripts/docker
      - name: tool registry, FFI, infrastructure, Qwen3, and engine verification
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -v "$PWD":/src:ro \
            -e CARGO_TERM_COLOR=never -w /work alloy-native-builder:phase0 \
            bash -euo pipefail -c '
              tar -C /src --exclude=target --exclude=.git -cf - . | tar -C /work -xf -
              cargo test --locked -p tool-registry --all-targets
              cargo test --locked -p tool-registry --doc
              cargo test --locked -p mlx-ffi --all-targets -- --test-threads=1
              cargo test --locked -p inference-infra --all-targets
              cargo test --locked -p qwen3 --all-targets
              cargo test --locked -p qwen3 --doc
              cargo check --locked -p engine --all-targets
              cargo test --locked -p engine --all-targets
              cargo test --locked -p engine --doc
              RUSTDOCFLAGS="-D warnings" cargo doc --locked -p engine --no-deps
            '

  linux_core:
    name: linux-core-and-acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: build native test image
        shell: bash
        run: |
          set -euo pipefail

          docker build --platform linux/arm64 \
            -t alloy-native-builder:phase0 \
            -f scripts/docker/Dockerfile.repro \
            scripts/docker

      - name: harness-core, alloyd, and acceptance verification
        shell: bash
        env:
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p target/w4-acceptance/linux target/w5-acceptance/linux
          for evidence in target/w4-acceptance/linux target/w5-acceptance/linux; do
            printf 'checkout=%s\npr_head=%s\ntree=%s\n' "$GITHUB_SHA" "$CI_PR_HEAD" "$(git rev-parse 'HEAD^{tree}')" > "$evidence/ci-identity.txt"
          done
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src:ro \
            -v "$PWD/target/w4-acceptance/linux":/evidence \
            -v "$PWD/target/w5-acceptance/linux":/w5-evidence \
            -e ALLOY_W5_OUTPUT=/w5-evidence \
            -e ALLOY_W5_CANDIDATE="${{ github.sha }}" \
            -e ALLOY_W4_OUTPUT=/evidence \
            -e ALLOY_W4_CANDIDATE="${{ github.sha }}" \
            -e CARGO_TERM_COLOR=never \
            -w /work \
            alloy-native-builder:phase0 \
            bash -euo pipefail -c '
              # Compile from a writable copy, preserving the read-only
              # source checkout and excluding previous build artifacts.
              tar -C /src \
                --exclude=target \
                --exclude=.git \
                -cf - . |
                tar -C /work -xf -

              echo "::group::Format check"
              rustup component add rustfmt clippy 2>/dev/null || true
              cargo fmt --all -- --check
              echo "::endgroup::"

              echo "::group::Clippy workspace lint"
              cargo clippy --locked --workspace --all-targets -- -D warnings
              echo "::endgroup::"

              echo "::group::Harness-core all-target tests"
              cargo test --locked -p harness-core --all-targets
              echo "::endgroup::"

              echo "::group::Harness-core documentation tests"
              cargo test --locked -p harness-core --doc
              echo "::endgroup::"

              echo "::group::Alloyd all-target tests"
              cargo test --locked -p alloyd --all-targets
              echo "::endgroup::"

              echo "::group::Alloyd documentation tests"
              cargo test --locked -p alloyd --doc
              echo "::endgroup::"

              echo "::group::Builtin named gates and evidence"
              RUSTDOCFLAGS="-D warnings" cargo doc --locked -p tool-registry -p harness-core -p engine --no-deps
              bash scripts/builtin_acceptance.sh
              bash scripts/plugin_acceptance.sh
              grep -Fx "exit_code=0" /evidence/status.txt
              test -s /evidence/p2-07-run.log && test -s /evidence/p2-09-run.log
              test -s /w5-evidence/report.json
              echo "::endgroup::"
            '

      - name: Retain W5 Linux evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: w5-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/w5-acceptance/linux/
          if-no-files-found: error
          retention-days: 30

      - name: Retain W4 Linux evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: w4-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/w4-acceptance/linux/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: linux-arm64
    needs: [linux_foundation, linux_repro, linux_engine, linux_core]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux shard
        env:
          FOUNDATION: ${{ needs.linux_foundation.result }}
          REPRO: ${{ needs.linux_repro.result }}
          ENGINE: ${{ needs.linux_engine.result }}
          CORE: ${{ needs.linux_core.result }}
        run: test "$FOUNDATION" = success && test "$REPRO" = success && test "$ENGINE" = success && test "$CORE" = success

  mac_core:
    name: mac-core

    # Every repository push and same-repository PR validates the unified
    # CPU/GPU path. Fork PRs do not execute on the persistent Mac runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, macOS, arm64]
    defaults:
      run:
        shell: python3 scripts/ci/mac_locked_step.py {0}
    timeout-minutes: 180
    env:
      # A pre-provisioned flat artifact directory; empty uses the documented local default.
      CI_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      ALLOY_QWEN3_ARTIFACT: ${{ vars.ALLOY_QWEN3_ARTIFACT }}
      ALLOY_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/target/phase-1-acceptance

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Clean source while retaining the Cargo build cache
        id: clean_source
        run: |
          set -euo pipefail
          git reset --hard "$CI_CANDIDATE"
          git clean -ffdx -e /target/
          rm -rf -- target/w4-acceptance target/w5-acceptance target/phase-1-acceptance
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"

      - name: Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ts/cli/package-lock.json

      - name: CLI and monitor tests
        run: cd ts/cli && npm ci && npm test && node --test scripts/real-model-acceptance.test.mjs && node --test ../../scripts/homebrew/*.test.mjs

      - name: Host lock regression
        run: python3 -B -m unittest discover -s scripts/tests -p test_mac_ci_lock.py

      # This collector retains W3 gates/source evidence and executes the full
      # serial workspace suite, check, Clippy, doctests, strict rustdoc, and
      # parallel harness suite. Share that verification with mac-core.
      - name: Approval/storage and complete native workspace verification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_CANDIDATE"
          evidence="$RUNNER_TEMP/approval-storage-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-macos"
          mkdir -p "$evidence"
          printf 'candidate=%s\nrun=%s/%s/actions/runs/%s\nattempt=%s\n' \
            "$CI_CANDIDATE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$evidence/workflow.txt"
          python3 scripts/approval_storage_evidence.py \
            --repo "$PWD" --expected-commit "$CI_CANDIDATE" --output "$evidence/results"

      - name: Retain approval/storage macOS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: approval-storage-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approval-storage-evidence-${{ github.run_id }}-${{ github.run_attempt }}-macos/
          if-no-files-found: error
          retention-days: 30

      # Preserve the previous default-parallel schedules in addition to the
      # collector's serial run. MLX remains serial; harness runs in parallel
      # in the collector and W5. No package's former schedule is dropped.
      - name: Native parallel package regression
        run: cargo test --locked --workspace --exclude mlx-ffi --exclude harness-core --all-targets

      - name: W4 scoped named gates and candidate evidence
        env:
          ALLOY_W4_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          ALLOY_W4_OUTPUT: ${{ github.workspace }}/target/w4-acceptance/macos
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_CANDIDATE"
          mkdir -p "$ALLOY_W4_OUTPUT"
          printf 'checkout=%s\npr_head=%s\ntree=%s\n' "$CI_CANDIDATE" "$CI_PR_HEAD" "$(git rev-parse 'HEAD^{tree}')" > "$ALLOY_W4_OUTPUT/ci-identity.txt"
          bash scripts/builtin_acceptance.sh
          grep -Fx 'exit_code=0' "$ALLOY_W4_OUTPUT/status.txt"
          test -s "$ALLOY_W4_OUTPUT/p2-07-run.log" && test -s "$ALLOY_W4_OUTPUT/p2-09-run.log"

      - name: Retain builtin macOS evidence
        if: ${{ always() && steps.clean_source.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: w4-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/w4-acceptance/macos/
          if-no-files-found: error
          retention-days: 30

      - name: W5 named hooks, owned-process and sandbox gates
        env:
          ALLOY_W5_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          ALLOY_W5_OUTPUT: ${{ github.workspace }}/target/w5-acceptance/macos
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CI_CANDIDATE"
          mkdir -p "$ALLOY_W5_OUTPUT"
          printf 'checkout=%s\npr_head=%s\ntree=%s\n' "$CI_CANDIDATE" "$CI_PR_HEAD" "$(git rev-parse 'HEAD^{tree}')" > "$ALLOY_W5_OUTPUT/ci-identity.txt"
          bash scripts/plugin_acceptance.sh
          test -s "$ALLOY_W5_OUTPUT/report.json"

      - name: Retain plugin macOS evidence
        if: ${{ always() && steps.clean_source.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: w5-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/w5-acceptance/macos/
          if-no-files-found: error
          retention-days: 30

  # Independent physical Macs enable these two jobs to run simultaneously.
  # A single registered Mac serializes them; never run two model jobs on the
  # same host merely by registering extra runner processes.
  mac_integration:
    name: mac-installed-and-real-model
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64]
    defaults:
      run:
        shell: python3 scripts/ci/mac_locked_step.py {0}
    timeout-minutes: 180
    env:
      CI_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      ALLOY_QWEN3_ARTIFACT: ${{ vars.ALLOY_QWEN3_ARTIFACT }}
      ALLOY_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/target/phase-1-acceptance
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          clean: false
          persist-credentials: false
      - name: Clean source while retaining the Cargo build cache
        id: clean_source
        run: |
          set -euo pipefail
          git reset --hard "$CI_CANDIDATE"
          git clean -ffdx -e /target/
          rm -rf -- target/w4-acceptance target/w5-acceptance target/phase-1-acceptance
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"

      - name: Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ts/cli/package-lock.json
      - name: Inspect Homebrew host locks
        run: node scripts/homebrew/host-check.mjs

      - name: Retain early Homebrew host evidence
        if: ${{ always() && steps.clean_source.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: homebrew-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/phase-1-acceptance/homebrew-host/
          if-no-files-found: error
          retention-days: 7

      - name: Install CLI build dependencies
        run: cd ts/cli && npm ci

      - name: "Test 13: real Qwen3 incremental CLI stream"
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        run: bash ts/cli/scripts/qwen3_end_to_end_stream.sh

      - name: "Test 14: real daemon restart, history, and SSD KV restore"
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: bash ts/cli/scripts/session_restart_real_model.sh

      - name: "P2-16: mocked-inference tool round-trip latency"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$ALLOY_ACCEPTANCE_OUTPUT_DIR/phase-2"
          cargo test --locked -p harness-core --test tool_latency tool_roundtrip_overhead_under_50ms -- --exact --nocapture 2>&1 | tee "$ALLOY_ACCEPTANCE_OUTPUT_DIR/phase-2/tool-latency.log"

      - name: "P2-15: real Qwen3 tool loop and plugin hooks"
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        env:
          ALLOY_E2E_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ts/cli/scripts/phase2_tool_loop_real_model.sh

      - name: "M9: real 4B and 14B memory acceptance"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          ALLOY_M9_MODEL_A_DIR: ${{ vars.ALLOY_QWEN3_ARTIFACT }}
          ALLOY_M9_MODEL_B_DIR: ${{ vars.ALLOY_M9_MODEL_B_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$ALLOY_ACCEPTANCE_OUTPUT_DIR"
          evidence_dir="$(mktemp -d "$ALLOY_ACCEPTANCE_OUTPUT_DIR/m9-large-model-XXXXXX")"
          export ALLOY_M9_OUTPUT="$evidence_dir/acceptance.jsonl"
          driver_status=0
          bash scripts/large_model_acceptance.sh 2>&1 | tee "$evidence_dir/driver.log" || driver_status=$?
          node ts/cli/scripts/real-model-acceptance.mjs --summarize-m9 "$ALLOY_M9_OUTPUT"
          exit "$driver_status"

      - name: Homebrew installed CPU/Metal and real-model acceptance
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: exec node scripts/homebrew/ci.mjs

      - name: Clean this run's owned Homebrew resources
        if: ${{ always() }}
        timeout-minutes: 5
        shell: python3 scripts/ci/mac_locked_step.py --cleanup {0}
        run: exec node scripts/homebrew/ci.mjs --cleanup-owned

      - name: Retain Phase 1 and Homebrew acceptance evidence
        if: ${{ always() && steps.clean_source.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: phase-1-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/phase-1-acceptance/
          if-no-files-found: error
          retention-days: 30

  mac:
    name: mac-metal
    needs: [mac_core, mac_integration]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Require both macOS shards
        env:
          CORE: ${{ needs.mac_core.result }}
          INTEGRATION: ${{ needs.mac_integration.result }}
        run: test "$CORE" = success && test "$INTEGRATION" = success

  approval_storage_mac:
    # Preserve the required approval check without queuing a duplicate complete
    # workspace run on the same physical Mac. mac-core also requires its upload.
    name: approval-storage-macos-arm64
    needs: [mac_core]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require collected approval/storage macOS evidence
        env:
          CORE: ${{ needs.mac_core.result }}
        run: test "$CORE" = success

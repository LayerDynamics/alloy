name: w3-evidence

on:
  push:
    branches: [feat/30-policy-approvals-artifacts]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w3-evidence-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: w3-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      W3_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize evidence path on runner
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/w3-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-linux"
          mkdir -p "$evidence"
          printf 'W3_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
      - name: Checkout exact candidate with history
        uses: actions/checkout@v5
        with:
          ref: ${{ env.W3_CANDIDATE }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Record workflow provenance
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$W3_EVIDENCE"
          printf 'candidate=%s\nrun=%s/%s/actions/runs/%s\nattempt=%s\n' \
            "$W3_CANDIDATE" "$SERVER_URL" "$REPOSITORY" "$RUN_ID" "$RUN_ATTEMPT" \
            > "$W3_EVIDENCE/workflow.txt"
      - name: Build existing Linux native environment
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 \
            -t alloy-w3-native:local \
            -f scripts/docker/Dockerfile.repro scripts/docker \
            2>&1 | tee "$W3_EVIDENCE/image-build.log"
      - name: Collect W3 gates and complete source sections
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src:ro \
            -v "$W3_EVIDENCE":/evidence \
            -e W3_CANDIDATE -e CARGO_TERM_COLOR=never \
            -w /work alloy-w3-native:local \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends python3
              tar -C /src --exclude=target -cf - . | tar -C /work -xf -
              test "$(git rev-parse HEAD)" = "$W3_CANDIDATE"
              rustup component add rustfmt clippy
              python3 scripts/w3_collect.py \
                --repo /work --expected-commit "$W3_CANDIDATE" \
                --output /evidence/results
            ' 2>&1 | tee "$W3_EVIDENCE/collector-driver.log"
      - name: Retain W3 Linux evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: w3-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.W3_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30

  mac:
    name: w3-macos-arm64
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 180
    env:
      W3_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize evidence path on runner
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/w3-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-macos"
          mkdir -p "$evidence"
          printf 'W3_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
      - name: Checkout exact candidate with history
        uses: actions/checkout@v5
        with:
          ref: ${{ env.W3_CANDIDATE }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Record workflow provenance
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$W3_EVIDENCE"
          printf 'candidate=%s\nrun=%s/%s/actions/runs/%s\nattempt=%s\n' \
            "$W3_CANDIDATE" "$SERVER_URL" "$REPOSITORY" "$RUN_ID" "$RUN_ATTEMPT" \
            > "$W3_EVIDENCE/workflow.txt"
      - name: Collect W3 gates and complete source sections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W3_CANDIDATE"
          rustup component add rustfmt clippy
          python3 scripts/w3_collect.py \
            --repo "$PWD" --expected-commit "$W3_CANDIDATE" \
            --output "$W3_EVIDENCE/results" \
            2>&1 | tee "$W3_EVIDENCE/collector-driver.log"
      - name: Retain W3 macOS evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: w3-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.W3_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30

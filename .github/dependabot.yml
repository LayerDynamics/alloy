version: 2
updates:
  # Keep action pins off deprecated runtimes (node20 rot, Nov 2026).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # ts/cli is the only npm package (devDependencies only today).
  - package-ecosystem: npm
    directory: /ts/cli
    schedule:
      interval: weekly

  # Rust workspace at the root; Cargo.lock is committed and CI uses --locked.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
